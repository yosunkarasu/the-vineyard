<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Vineyard · 18+</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; background:#080010; overflow:hidden; font-family:Georgia,serif; color:#f0e0ea; }

/* ─── SCREENS ─── */
.page { position:fixed; top:0; left:0; width:100%; height:100%; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:10; }
.page.active { display:flex; }

/* ─── BG VIDEO ─── */
#bgv {
  position:fixed; top:0; left:0; width:100%; height:100%;
  object-fit:cover; z-index:1; opacity:0;
  transition:opacity 1.5s; pointer-events:none;
}
#bgv.on { opacity:0.6; }

/* ─── DARK OVERLAY ─── */
#bgoverlay {
  position:fixed; top:0; left:0; width:100%; height:100%; z-index:2;
  background:linear-gradient(to top, rgba(5,0,10,0.95) 0%, rgba(5,0,10,0.2) 50%, rgba(5,0,10,0.5) 100%);
  pointer-events:none;
}

/* ─── TITLE PAGE ─── */
#pg-title { z-index:10; text-align:center; padding:30px 24px; }
#pg-title h1 { font-size:40px; letter-spacing:8px; color:#f0e0ea; text-transform:uppercase; margin-bottom:6px; text-shadow:0 0 30px rgba(200,80,140,0.8); }
#pg-title h2 { font-size:12px; color:#907080; letter-spacing:4px; text-transform:uppercase; margin-bottom:50px; }
#pg-title button {
  background:transparent; border:1px solid #c06090; border-radius:40px;
  padding:16px 56px; color:#f0e0ea; font-family:Georgia,serif; font-size:16px;
  letter-spacing:3px; text-transform:uppercase; cursor:pointer;
}
#pg-title button:active { background:rgba(200,80,140,0.2); }
#pg-title p { margin-top:28px; font-size:11px; color:#504050; letter-spacing:1px; }

/* ─── STORY PAGE ─── */
#pg-story { z-index:10; justify-content:flex-end; align-items:stretch; }
#story-box {
  padding:22px 22px 36px; max-width:680px; width:100%;
  background:linear-gradient(to top, rgba(5,0,10,0.98) 0%, rgba(5,0,10,0.85) 100%);
}
#story-chapter { font-size:10px; color:#c09040; letter-spacing:3px; text-transform:uppercase; margin-bottom:8px; }
#story-title { font-size:18px; color:#f0e0ea; margin-bottom:12px; font-weight:normal; }
#story-text { font-size:15px; line-height:1.85; color:#d8c0cc; margin-bottom:20px; max-height:38vh; overflow-y:auto; }
#story-text p { margin-bottom:12px; }
#story-text em { color:#d04080; font-style:italic; }
#story-text strong { color:#c09040; font-weight:normal; }
#story-choices { display:flex; flex-direction:column; gap:10px; }
.choice-btn {
  background:rgba(20,0,15,0.8); border:1px solid #380028; border-radius:10px;
  padding:14px 16px; color:#f0e0ea; font-family:Georgia,serif; font-size:14px;
  text-align:left; cursor:pointer; line-height:1.5;
}
.choice-btn:active { background:rgba(60,0,40,0.9); border-color:#c06090; }
.choice-arrow { color:#c06090; margin-right:8px; }

/* ─── INTERACTION PAGE ─── */
#pg-interact { z-index:10; justify-content:space-between; }

/* Character area */
#char-area {
  flex:1; width:100%; display:flex; align-items:center;
  justify-content:center; position:relative; overflow:hidden;
}
#char-container {
  position:relative;
  width:min(280px, 62vw);
  height:min(480px, 65vh);
}
.char-img {
  position:absolute; top:0; left:0; width:100%; height:100%;
  object-fit:contain; object-position:center bottom;
  opacity:0; transition:opacity 0.7s ease;
  filter:drop-shadow(0 8px 24px rgba(200,80,140,0.5));
}
.char-img.visible { opacity:1; }

/* State label */
#state-label {
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  background:rgba(5,0,10,0.85); border:1px solid #380028;
  border-radius:20px; padding:5px 14px; font-size:10px;
  color:#c09040; letter-spacing:2px; text-transform:uppercase;
  white-space:nowrap; z-index:5;
}

/* Touch zones — transparent overlays on character */
.touch-zone {
  position:absolute; cursor:pointer;
  background:transparent; border:none; padding:0;
  /* uncomment below to debug zone positions: */
  /* background:rgba(255,0,0,0.15); border:1px solid red; */
}
.touch-zone:active { background:rgba(200,80,140,0.1); }

/* Response bubble */
#response {
  position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  width:92%; max-width:420px;
  background:rgba(5,0,10,0.94); border:1px solid #380028;
  border-radius:12px; padding:14px 16px;
  font-size:14px; color:#f0e0ea; line-height:1.7;
  text-align:center; opacity:0; transition:opacity 0.3s;
  pointer-events:none; z-index:20;
}
#response.on { opacity:1; }
#response em { color:#d04080; }

/* Particle canvas */
#fx-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:15; pointer-events:none; }

/* Bottom bar */
#bottom-bar {
  width:100%; max-width:680px;
  padding:12px 20px 32px;
  background:linear-gradient(to top, rgba(5,0,10,0.98) 0%, rgba(5,0,10,0.75) 100%);
  z-index:10;
}
#hint-text { font-size:11px; color:#907080; letter-spacing:2px; text-align:center; margin-bottom:10px; text-transform:uppercase; }
#desire-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
#desire-row span { font-size:10px; color:#c09040; letter-spacing:2px; }
#heat-track { flex:1; height:4px; background:#1a0012; border-radius:2px; overflow:hidden; }
#heat-bar { height:100%; width:0%; background:linear-gradient(90deg, #c09040, #d04080); border-radius:2px; transition:width 0.4s ease; }
#continue-btn {
  width:100%; padding:14px; border-radius:10px;
  background:rgba(20,0,15,0.85); border:1px solid #d04080;
  color:#f0e0ea; font-family:Georgia,serif; font-size:14px;
  letter-spacing:1px; cursor:pointer; display:none;
}
#continue-btn:active { background:rgba(60,0,40,0.9); }

/* ─── END PAGE ─── */
#pg-end { z-index:10; text-align:center; padding:40px 24px; }
#end-title { font-size:24px; color:#f0e0ea; letter-spacing:3px; margin-bottom:14px; }
#end-text { font-size:15px; color:#907080; line-height:1.8; max-width:360px; margin:0 auto 36px; }
#end-replay { background:transparent; border:1px solid #c09040; border-radius:30px; padding:14px 40px; color:#c09040; font-family:Georgia,serif; font-size:14px; letter-spacing:2px; cursor:pointer; }
#end-count { margin-top:18px; font-size:11px; color:#504050; letter-spacing:2px; }

/* progress dots */
#dots { position:fixed; top:14px; right:14px; z-index:50; display:flex; gap:8px; }
.dot { width:8px; height:8px; border-radius:50%; background:#1a0012; border:1px solid #380028; transition:all 0.4s; }
.dot.done { background:#c09040; border-color:#c09040; }
.dot.now { background:#d04080; border-color:#d04080; box-shadow:0 0 6px rgba(208,64,128,0.6); }

::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:#380028; border-radius:2px; }
</style>
</head>
<body>

<video id="bgv" muted loop playsinline preload="none"></video>
<div id="bgoverlay"></div>
<canvas id="fx-canvas"></canvas>
<div id="dots">
  <div class="dot" id="dot0"></div>
  <div class="dot" id="dot1"></div>
  <div class="dot" id="dot2"></div>
</div>

<!-- TITLE -->
<div class="page active" id="pg-title">
  <h1>The Vineyard</h1>
  <h2>An Intimate Story · 18+</h2>
  <button onclick="startGame()">Begin</button>
  <p>For mature audiences · For her pleasure</p>
</div>

<!-- STORY -->
<div class="page" id="pg-story">
  <div id="story-box">
    <div id="story-chapter"></div>
    <div id="story-title"></div>
    <div id="story-text"></div>
    <div id="story-choices"></div>
  </div>
</div>

<!-- INTERACTION -->
<div class="page" id="pg-interact">
  <div id="char-area">
    <div id="response"></div>
    <div id="char-container">
      <div id="state-label">Dressed</div>

      <!-- Character states: m0=dressed, m1=shirtless, m2=wet, m3=boxers, m4=nude, m5=aroused -->
      <img class="char-img visible" id="ci0" src="./chars/m0.png" alt="">
      <img class="char-img" id="ci1" src="./chars/m1.png" alt="">
      <img class="char-img" id="ci2" src="./chars/m2.png" alt="">
      <img class="char-img" id="ci3" src="./chars/m3.png" alt="">
      <img class="char-img" id="ci4" src="./chars/m4.png" alt="" onerror="this.src=''">
      <img class="char-img" id="ci5" src="./chars/m5.png" alt="" onerror="this.src=''">

      <!-- Touch zones (% of container) -->
      <button class="touch-zone" id="tz-hair"    style="top:0;    left:20%; width:60%; height:16%;" onclick="touch('hair',   event)"></button>
      <button class="touch-zone" id="tz-face"    style="top:14%;  left:22%; width:56%; height:15%;" onclick="touch('face',   event)"></button>
      <button class="touch-zone" id="tz-neck"    style="top:27%;  left:32%; width:36%; height:8%;"  onclick="touch('neck',   event)"></button>
      <button class="touch-zone" id="tz-chest"   style="top:34%;  left:18%; width:64%; height:15%;" onclick="touch('chest',  event)"></button>
      <button class="touch-zone" id="tz-abs"     style="top:48%;  left:24%; width:52%; height:12%;" onclick="touch('abs',    event)"></button>
      <button class="touch-zone" id="tz-waist"   style="top:59%;  left:22%; width:56%; height:10%;" onclick="touch('waist',  event)"></button>
      <button class="touch-zone" id="tz-hips"    style="top:68%;  left:18%; width:64%; height:13%;" onclick="touch('hips',   event)"></button>
      <button class="touch-zone" id="tz-thighs"  style="top:80%;  left:20%; width:60%; height:16%;" onclick="touch('thighs', event)"></button>
    </div>
  </div>

  <div id="bottom-bar">
    <div id="hint-text">Touch him ↑</div>
    <div id="desire-row">
      <span>DESIRE</span>
      <div id="heat-track"><div id="heat-bar"></div></div>
      <span id="heat-num">0%</span>
    </div>
    <button id="continue-btn" onclick="onContinue()">Continue the story →</button>
  </div>
</div>

<!-- END -->
<div class="page" id="pg-end">
  <div style="font-size:32px;color:#c09040;margin-bottom:18px;">✦</div>
  <div id="end-title"></div>
  <div id="end-text"></div>
  <button id="end-replay" onclick="showPage('pg-title')">↩ Another Path</button>
  <div id="end-count"></div>
</div>

<script>
'use strict';

// ═══════ PARTICLE FX ═══════
const fxc = document.getElementById('fx-canvas');
const fxctx = fxc.getContext('2d');
const pts = [];
function resizeFX(){ fxc.width=innerWidth; fxc.height=innerHeight; }
resizeFX(); window.addEventListener('resize', resizeFX);
for(let i=0;i<45;i++) pts.push({x:Math.random()*1000,y:Math.random()*1000,r:Math.random()*1.4+.3,s:Math.random()*.2+.04,o:Math.random()*.35+.06,h:Math.random()>.5?330:45});
(function drawBG(){
  fxctx.clearRect(0,0,fxc.width,fxc.height);
  const g=fxctx.createRadialGradient(fxc.width/2,fxc.height*.4,0,fxc.width/2,fxc.height*.4,Math.max(fxc.width,fxc.height)*.8);
  g.addColorStop(0,'rgba(15,0,10,.25)'); g.addColorStop(1,'rgba(2,0,5,.9)');
  fxctx.fillStyle=g; fxctx.fillRect(0,0,fxc.width,fxc.height);
  pts.forEach(p=>{
    p.y-=p.s; if(p.y<-5){p.y=fxc.height+5;p.x=Math.random()*fxc.width;}
    fxctx.beginPath(); fxctx.arc(p.x%fxc.width,p.y,p.r,0,Math.PI*2);
    fxctx.fillStyle=`hsla(${p.h},68%,70%,${p.o})`; fxctx.fill();
  });
  requestAnimationFrame(drawBG);
})();

// ═══════ CLICK SPARKS ═══════
function spawnSparks(x, y){
  const sparks=[];
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2, d=20+Math.random()*40;
    sparks.push({x,y,tx:x+Math.cos(a)*d,ty:y+Math.sin(a)*d,life:1,h:Math.random()>.5?330:45,r:2+Math.random()*3});
  }
  let frame=0;
  (function draw(){
    if(frame++>20) return;
    sparks.forEach(s=>{
      s.x+=(s.tx-s.x)*.18; s.y+=(s.ty-s.y)*.18; s.life-=.05;
      fxctx.beginPath(); fxctx.arc(s.x,s.y,s.r*s.life,0,Math.PI*2);
      fxctx.fillStyle=`hsla(${s.h},80%,70%,${s.life})`; fxctx.fill();
    });
    requestAnimationFrame(draw);
  })();
}

// ═══════ VIDEO ═══════
const VIDEOS={title:'./videos/title.mp4',vineyard:'./videos/vineyard.mp4',cellar:'./videos/cellar.mp4',pool:'./videos/pool.mp4'};
let curVid=null;
function playVideo(key){
  const el=document.getElementById('bgv');
  const src=VIDEOS[key]||'';
  if(!src){el.classList.remove('on');return;}
  if(src===curVid) return;
  curVid=src;
  el.classList.remove('on');
  el.src=src; el.load();
  el.oncanplay=()=>{ el.play().catch(()=>{}); el.classList.add('on'); };
  setTimeout(()=>el.classList.add('on'), 1200); // fallback
}

// ═══════ STATE ═══════
const ENDINGS = new Set();
let G = {};
const TOUCHES_NEEDED = 10;

const STATE_NAMES = ['Dressed','Shirt Off','Dripping Wet','Boxers Only','Undressed','Aroused'];
const STATE_AT    = [0, 18, 38, 58, 78, 92]; // heat % thresholds

function charStateFor(heat){
  let s = 0;
  for(let i=STATE_AT.length-1; i>=0; i--){
    if(heat >= STATE_AT[i]){ s=i; break; }
  }
  // clamp if images missing
  while(s>=4 && !imgOk(s)) s--;
  return s;
}

function imgOk(idx){
  const el = document.getElementById('ci'+idx);
  return el && el.src && el.src !== '' && el.naturalWidth > 0;
}

function setCharState(heat){
  const s = charStateFor(heat);
  if(s === G.charState) return;
  G.charState = s;
  // flash
  const cc = document.getElementById('char-container');
  cc.style.transition='opacity .12s'; cc.style.opacity='.3';
  setTimeout(()=>{ cc.style.opacity='1'; }, 150);
  // swap images
  for(let i=0;i<6;i++){
    const el=document.getElementById('ci'+i);
    if(el) el.classList.toggle('visible', i===s);
  }
  document.getElementById('state-label').textContent = STATE_NAMES[s]||'';
}

// ═══════ TOUCH RESPONSES ═══════
const RESP = {
  hair:[
    "You reach up and run your fingers slowly through his dark hair. It's thick, slightly dishevelled, warm from the sun. He goes very still — the way a man goes still when something feels better than expected.",
    "<em>He makes a low sound and tilts his head into your hand like a man surrendering something he'd been holding onto.</em> \"You're going to ruin me,\" he says quietly. He doesn't sound like he minds.",
    "He catches your wrist, turns it over, and presses his lips to the soft skin of your inner wrist — slowly, deliberately, his eyes on yours the entire time. <em>Your pulse jumps. He feels it. He smiles.</em>"
  ],
  face:[
    "You trace the line of his jaw with your fingertips. The dark stubble is rough and real and warm. He doesn't move — he lets you look, lets you learn the shape of him, which is more intimate than anything else he could have done.",
    "<em>He turns his face into your palm.</em> His eyes close. He breathes in once, slowly. In this moment he looks nothing like a man in control of anything, and it is the most attractive thing you have ever seen.",
    "He turns and kisses your fingers — each one, slowly, his lips barely touching, his eyes open and watching your face the whole time. <em>Patient. Thorough. As if he has all night and has already decided to use every minute of it.</em>"
  ],
  neck:[
    "You press your lips lightly to the side of his neck, just below his jaw. His skin is warm. His pulse is faster than it should be for a man who appears this composed. <em>You file that away with satisfaction.</em>",
    "A sharp breath. His hands find your waist and pull you in — not urgently, but with a certainty that leaves no room for doubt. <em>\"There,\"</em> he says against your hair, as if something has been resolved.",
    "His head drops back and your mouth moves slowly down his throat. <em>He says your name — once, just once, in a voice made rough at the edges — and it sounds like the exact moment a man stops pretending he isn't completely undone.</em>"
  ],
  chest:[
    "You rest both palms flat against his chest. Warm skin, firm muscle, and beneath it the unmistakable rapid beat of his heart. <em>He's been calm this whole time. He is not calm now.</em>",
    "You feel every breath he draws — <em>each one slightly less steady than the last.</em> He covers your hands with his own, not to move them away but to hold them there, to keep your palms against him like something precious.",
    "You press your lips to the centre of his chest. <em>He goes completely still — the focused, concentrated stillness of a man who has decided that nothing in the world matters except this exact moment.</em> His arms come around you and hold you there."
  ],
  abs:[
    "Your fingertips trail slowly down the line of his stomach. The muscles contract sharply beneath your touch — <em>an involuntary response, honest and immediate, that tells you everything.</em>",
    "<em>He exhales — slow, deliberate, a breath he's been holding.</em> You let your nails drag just barely across his skin and he makes a sound so unguarded it sends warmth rushing through you. Good. You wanted to hear that.",
    "Your hands move lower and his eyes darken. <em>He watches you with the full, undivided attention of someone who has forgotten there is anything else in the world.</em> \"Yes,\" he says — barely a word, more a breath — and the simplicity of it is more arousing than anything elaborate."
  ],
  waist:[
    "Your hands slide around his waist and you feel the warmth of his bare skin, the taut muscle beneath. You draw him gently closer. <em>He comes — without resistance, without hesitation, as if he's been waiting for exactly this.</em>",
    "Your thumbs hook into the low waistband and you feel him hold his breath. <em>Not from reluctance — from wanting too much, holding himself back, giving you the choice.</em> The restraint itself is devastatingly attractive.",
    "His forehead drops to rest against yours. You're so close you share the same air. <em>\"You don't have to stop,\"</em> he says — low, honest, a little rough — <em>\"and I really hope you won't.\"</em>"
  ],
  hips:[
    "Your hands grip his hips — <em>a grip with intention in it, the particular confidence of a woman who knows what she wants.</em> Something in his expression shifts. He looks at you differently now. He's paying close attention.",
    "He shifts his weight toward you, closing the last distance, and <em>the conversation that has been happening silently between you all evening finally says everything at once.</em> His gaze moves from your eyes to your mouth and back.",
    "<em>You pull him against you and feel the full, honest extent of what you do to him.</em> He makes a sound low in his throat and his hand finds the back of your neck, fingers threading into your hair. \"I've been thinking about this,\" he says, \"since the moment you arrived.\""
  ],
  thighs:[
    "Your hand rests on his thigh. He doesn't move. He barely breathes. <em>He is giving you absolute control and you feel it like a gift.</em>",
    "<em>His hand finds yours — not pulling away, but covering yours, pressing it closer, guiding.</em> His breathing has changed entirely. He is no longer the composed man who met you at the door.",
    "You feel him shiver — a small, involuntary tremor — as your touch moves slowly upward. <em>\"God,\"</em> he breathes — not performed, not dramatic, just honest and helpless — <em>and he pulls you against him with both arms like a man who has finally stopped trying to be patient.</em>"
  ]
};

function touch(zone, e){
  const rect = document.getElementById('char-area').getBoundingClientRect();
  const cx = (e.clientX||e.pageX||rect.left+rect.width/2);
  const cy = (e.clientY||e.pageY||rect.top+rect.height/2);
  spawnSparks(cx, cy);

  G.touches++;
  const heat = Math.min(100, Math.round(G.touches/TOUCHES_NEEDED*100));
  G.heat = heat;
  document.getElementById('heat-bar').style.width = heat+'%';
  document.getElementById('heat-num').textContent = heat+'%';
  setCharState(heat);

  const tier = heat < 35 ? 0 : heat < 70 ? 1 : 2;
  const arr = RESP[zone]||[];
  showResponse(arr[Math.min(tier, arr.length-1)]||'');

  if(G.touches >= TOUCHES_NEEDED){
    document.getElementById('hint-text').textContent = 'Ready ↓';
    document.getElementById('continue-btn').style.display = 'block';
  }
}

function showResponse(html){
  const el = document.getElementById('response');
  el.innerHTML = html;
  el.classList.remove('on');
  void el.offsetWidth;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('on'), 3800);
}

function onContinue(){
  if(G.nextPassage) goTo(G.nextPassage);
}

// ═══════ NAVIGATION ═══════
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setDots(n){
  ['dot0','dot1','dot2'].forEach((id,i)=>{
    const el=document.getElementById(id);
    el.className = 'dot' + (i<n?' done': i===n?' now':'');
  });
}

function startGame(){
  G = {heat:0, touches:0, nextPassage:null, charState:0, path:null};
  goTo('start');
}

function goTo(id){
  const p = PASSAGES[id];
  if(!p){ console.error('Missing passage:', id); return; }
  if(p.path) G.path = p.path;
  if(p.dot !== undefined) setDots(p.dot);

  if(p.type === 'interaction'){
    G.nextPassage = p.next;
    G.touches = 0; G.heat = 0; G.charState = -1;
    document.getElementById('heat-bar').style.width='0%';
    document.getElementById('heat-num').textContent='0%';
    document.getElementById('hint-text').textContent='Touch him ↑';
    document.getElementById('continue-btn').style.display='none';
    // reset to dressed
    for(let i=0;i<6;i++){
      const el=document.getElementById('ci'+i);
      if(el) el.classList.toggle('visible', i===0);
    }
    G.charState=0;
    document.getElementById('state-label').textContent=STATE_NAMES[0];
    playVideo(p.video||G.path||'title');
    showPage('pg-interact');
    return;
  }

  if(p.type === 'ending'){
    ENDINGS.add(id);
    playVideo('title');
    document.getElementById('end-title').textContent = p.title||'The End';
    document.getElementById('end-text').textContent  = p.text||'';
    document.getElementById('end-count').textContent = `Endings found: ${ENDINGS.size} / 3`;
    showPage('pg-end');
    return;
  }

  // story passage
  playVideo(p.video || G.path || 'title');
  document.getElementById('story-chapter').textContent = p.chapter||'';
  document.getElementById('story-title').textContent   = p.storyTitle||'';
  document.getElementById('story-text').innerHTML      = p.text||'';
  const cb = document.getElementById('story-choices');
  cb.innerHTML='';
