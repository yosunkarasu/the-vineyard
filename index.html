<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0009">
<title>The Vineyard — An Erotic Story</title>
<style>
  :root {
    --bg:       #0d0009;
    --bg2:      #160010;
    --card:     #1e0018;
    --border:   #3d0030;
    --gold:     #c9a84c;
    --rose:     #d4607a;
    --text:     #f0e6ea;
    --dim:      #9e8a90;
    --btn:      #2a0020;
    --btn-h:    #3d0030;
    --radius:   14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #game-wrap {
    width: 100%;
    max-width: 680px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 0 40px;
  }

  /* ── Header ── */
  #hdr {
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #hdr-title { font-size: 13px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; }
  #hdr-chapter { font-size: 11px; color: var(--dim); letter-spacing: 1px; }

  /* ── Progress bar ── */
  #progress-bar {
    height: 2px;
    background: var(--border);
    width: 100%;
  }
  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rose), var(--gold));
    transition: width 0.6s ease;
  }

  /* ── Story area ── */
  #story-area {
    flex: 1;
    padding: 28px 22px 10px;
  }

  #passage-title {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0.8;
  }

  #passage-text {
    font-size: 17px;
    line-height: 1.85;
    color: var(--text);
    animation: fadeIn 0.5s ease;
  }

  #passage-text p { margin-bottom: 18px; }
  #passage-text em { color: var(--rose); font-style: italic; }
  #passage-text strong { color: var(--gold); font-weight: normal; }

  /* ── Choices ── */
  #choices {
    padding: 10px 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: fadeIn 0.6s ease 0.2s both;
  }

  .choice-btn {
    background: var(--btn);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    color: var(--text);
    font-family: 'Georgia', serif;
    font-size: 15px;
    line-height: 1.5;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.1s;
    -webkit-appearance: none;
    appearance: none;
  }
  .choice-btn:hover, .choice-btn:active {
    background: var(--btn-h);
    border-color: var(--rose);
    transform: translateY(-1px);
  }
  .choice-btn .choice-arrow {
    color: var(--rose);
    margin-right: 10px;
    font-size: 14px;
  }

  /* ── End screen ── */
  #end-screen {
    display: none;
    padding: 40px 22px;
    text-align: center;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .end-ornament { font-size: 32px; color: var(--gold); margin-bottom: 8px; }
  .end-title { font-size: 22px; color: var(--gold); letter-spacing: 2px; }
  .end-subtitle { font-size: 14px; color: var(--dim); line-height: 1.6; max-width: 360px; }
  .restart-btn {
    margin-top: 16px;
    background: transparent;
    border: 1px solid var(--rose);
    border-radius: var(--radius);
    padding: 14px 36px;
    color: var(--rose);
    font-family: 'Georgia', serif;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .restart-btn:hover { background: var(--btn-h); }

  /* ── Mood image strip ── */
  .scene-mood {
    width: 100%;
    height: 3px;
    margin: 6px 0 22px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--rose), var(--gold), transparent);
    opacity: 0.5;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Stats bar ── */
  #stats {
    display: flex;
    gap: 16px;
    padding: 10px 22px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1px;
  }
  .stat-val { color: var(--gold); margin-left: 4px; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>

//  ENGINE
// ═══════════════════════════════════════════════════════
const heatSymbols = ['', '❀', '❀❀', '❀❀❀', '❀❀❀❀'];
let completedEndings = new Set();

function goTo(passageId) {
  const p = passages[passageId];
  if (!p) return;

  state.visited.push(passageId);
  if (p.path)  state.path = p.path;
  if (p.heat && p.heat > state.heat) state.heat = p.heat;

  if (p.isEnding) {
    completedEndings.add(passageId);
    showEnding(p);
    return;
  }

  document.getElementById('passage-title').textContent = p.title || '';
  document.getElementById('hdr-chapter').textContent   = p.chapter || '';
  document.getElementById('progress-fill').style.width  = (p.progress || 0) + '%';
  document.getElementById('stat-path').textContent      = state.path || '—';
  document.getElementById('stat-heat').textContent      = heatSymbols[Math.min(state.heat, 4)];
  document.getElementById('stat-scenes').textContent    = completedEndings.size + ' / 3';

  const textDiv = document.getElementById('passage-text');
  textDiv.innerHTML = '<div class="scene-mood"></div>' + (p.text || '');

  const choicesDiv = document.getElementById('choices');
  choicesDiv.innerHTML = '';
  (p.choices || []).forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-arrow">›</span>${c.text}`;
    btn.onclick = () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => goTo(c.goto), 200);
    };
    choicesDiv.appendChild(btn);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showEnding(p) {
  document.getElementById('stat-scenes').textContent = completedEndings.size + ' / 3';
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('story-area').style.display  = 'none';
  document.getElementById('choices').style.display     = 'none';

  const endScreen = document.getElementById('end-screen');
  endScreen.style.display = 'flex';
  document.getElementById('end-title').textContent    = p.endingTitle || 'The End';
  document.getElementById('end-subtitle').textContent = p.endingSubtitle || '';

  const btn = endScreen.querySelector('.restart-btn');
  if (completedEndings.size >= 3) {
    btn.textContent = '✦ All paths discovered';
    btn.disabled = true;
    btn.style.opacity = '0.5';
  }
}
