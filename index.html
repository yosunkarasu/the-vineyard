<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0005">
<title>The Vineyard</title>
<style>
/* ═══════════ RESET & BASE ═══════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0005;font-family:'Georgia',serif;}

/* ═══════════ SCREENS ═══════════ */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;}
.screen.active{display:flex;}

/* ═══════════ AMBIENT BACKGROUND ═══════════ */
#bg-canvas{position:fixed;inset:0;z-index:0;}

/* Video background — hidden until you add mp4 files */
#bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0;transition:opacity 1s;pointer-events:none;}
#bg-video.visible{opacity:0.55;}

/* Dark overlay */
.overlay{position:fixed;inset:0;z-index:2;background:linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.5) 100%);pointer-events:none;}

/* ═══════════ TITLE SCREEN ═══════════ */
#screen-title{z-index:10;}
.title-wrap{text-align:center;padding:30px 24px;}
.title-ornament{font-size:28px;color:#c9a84c;margin-bottom:16px;animation:pulse 3s ease-in-out infinite;}
.title-main{font-size:42px;color:#f0e6ea;letter-spacing:8px;text-transform:uppercase;margin-bottom:8px;text-shadow:0 0 40px rgba(212,96,122,0.6);}
.title-sub{font-size:13px;color:#9e8a90;letter-spacing:4px;text-transform:uppercase;margin-bottom:48px;}
.title-btn{background:transparent;border:1px solid #d4607a;border-radius:40px;padding:16px 52px;color:#f0e6ea;font-family:'Georgia',serif;font-size:16px;letter-spacing:3px;cursor:pointer;transition:all 0.3s;text-transform:uppercase;}
.title-btn:hover,.title-btn:active{background:rgba(212,96,122,0.2);box-shadow:0 0 30px rgba(212,96,122,0.4);}
.title-note{margin-top:32px;font-size:11px;color:#6b5a60;letter-spacing:1px;line-height:1.8;max-width:300px;margin-left:auto;margin-right:auto;}

/* ═══════════ STORY SCREEN ═══════════ */
#screen-story{z-index:10;justify-content:flex-end;}
.story-card{width:100%;max-width:680px;padding:24px 24px 36px;background:linear-gradient(to top, rgba(10,0,5,0.97) 0%, rgba(10,0,5,0.8) 100%);}
.story-chapter{font-size:10px;color:#c9a84c;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;opacity:0.8;}
.story-title{font-size:18px;color:#f0e6ea;margin-bottom:14px;font-weight:normal;}
.story-text{font-size:15.5px;line-height:1.9;color:#d4c8cc;margin-bottom:22px;max-height:38vh;overflow-y:auto;}
.story-text p{margin-bottom:12px;}
.story-text em{color:#d4607a;font-style:italic;}
.story-text strong{color:#c9a84c;font-weight:normal;}
.story-choices{display:flex;flex-direction:column;gap:10px;}
.story-choice{background:rgba(30,0,24,0.7);border:1px solid #3d0030;border-radius:10px;padding:14px 18px;color:#f0e6ea;font-family:'Georgia',serif;font-size:14.5px;text-align:left;cursor:pointer;transition:all 0.2s;line-height:1.5;}
.story-choice:active,.story-choice:hover{background:rgba(61,0,48,0.8);border-color:#d4607a;}
.story-choice-arrow{color:#d4607a;margin-right:10px;}

/* ═══════════ INTERACTION SCREEN ═══════════ */
#screen-interact{z-index:10;justify-content:space-between;}

/* Character stage */
#char-stage{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}

/* SVG character */
#char-svg{position:relative;z-index:5;width:min(320px, 75vw);height:auto;filter:drop-shadow(0 0 20px rgba(212,96,122,0.3));animation:breathe 4s ease-in-out infinite;}

/* Hotspot click rings */
.click-ring{position:absolute;border-radius:50%;border:2px solid #d4607a;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(0.3);transition:none;z-index:20;}
.click-ring.burst{animation:ringBurst 0.6s ease-out forwards;}

/* Particle burst */
.particle{position:absolute;border-radius:50%;pointer-events:none;z-index:21;animation:particleFly 0.8s ease-out forwards;}

/* Response toast */
#response-toast{position:absolute;bottom:220px;left:50%;transform:translateX(-50%);width:88%;max-width:420px;background:rgba(10,0,5,0.92);border:1px solid #3d0030;border-radius:12px;padding:14px 18px;text-align:center;font-size:14px;color:#f0e6ea;line-height:1.6;z-index:30;opacity:0;transition:opacity 0.3s;pointer-events:none;}
#response-toast.show{opacity:1;}
#response-toast em{color:#d4607a;font-style:italic;}

/* Interaction bottom bar */
#interact-bar{width:100%;max-width:680px;padding:14px 20px 32px;background:linear-gradient(to top, rgba(10,0,5,0.98) 0%, rgba(10,0,5,0.7) 100%);z-index:15;}
.interact-hint{font-size:11px;color:#9e8a90;letter-spacing:2px;text-align:center;margin-bottom:12px;text-transform:uppercase;}
.heat-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.heat-label{font-size:10px;color:#c9a84c;letter-spacing:2px;white-space:nowrap;}
.heat-bar{flex:1;height:4px;background:#2a0020;border-radius:2px;overflow:hidden;}
.heat-fill{height:100%;background:linear-gradient(90deg,#c9a84c,#d4607a);border-radius:2px;transition:width 0.6s ease;width:0%;}
.interact-continue{width:100%;background:rgba(30,0,24,0.8);border:1px solid #3d0030;border-radius:10px;padding:14px;color:#9e8a90;font-family:'Georgia',serif;font-size:13px;letter-spacing:1px;cursor:pointer;transition:all 0.3s;display:none;}
.interact-continue.ready{display:block;color:#f0e6ea;border-color:#d4607a;}
.interact-continue:active{background:rgba(61,0,48,0.8);}

/* ═══════════ END SCREEN ═══════════ */
#screen-end{z-index:10;text-align:center;padding:40px 24px;}
.end-ornament{font-size:40px;color:#c9a84c;margin-bottom:20px;}
.end-title{font-size:26px;color:#f0e6ea;letter-spacing:3px;margin-bottom:16px;}
.end-text{font-size:15px;color:#9e8a90;line-height:1.8;max-width:360px;margin:0 auto 36px;}
.end-replay{background:transparent;border:1px solid #c9a84c;border-radius:30px;padding:14px 40px;color:#c9a84c;font-family:'Georgia',serif;font-size:14px;letter-spacing:2px;cursor:pointer;transition:all 0.3s;}
.end-replay:hover,.end-replay:active{background:rgba(201,168,76,0.15);}
.endings-count{margin-top:20px;font-size:11px;color:#6b5a60;letter-spacing:2px;}

/* ═══════════ ANIMATIONS ═══════════ */
@keyframes breathe{0%,100%{transform:scaleY(1);}50%{transform:scaleY(1.015);}}
@keyframes pulse{0%,100%{opacity:0.7;}50%{opacity:1;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes ringBurst{0%{opacity:0.9;transform:translate(-50%,-50%) scale(0.2);}100%{opacity:0;transform:translate(-50%,-50%) scale(3);}}
@keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--px),var(--py)) scale(0);}}
@keyframes toastSlide{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.screen{animation:fadeIn 0.5s ease;}

/* ═══════════ PROGRESS DOTS ═══════════ */
#progress-dots{position:fixed;top:16px;right:16px;z-index:50;display:flex;gap:8px;}
.dot{width:8px;height:8px;border-radius:50%;background:#2a0020;border:1px solid #3d0030;transition:all 0.4s;}
.dot.done{background:#c9a84c;border-color:#c9a84c;box-shadow:0 0 8px rgba(201,168,76,0.6);}
.dot.active{background:#d4607a;border-color:#d4607a;box-shadow:0 0 8px rgba(212,96,122,0.6);}

/* scrollbar */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#3d0030;border-radius:2px;}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════
//  AMBIENT CANVAS — particle atmosphere
// ═══════════════════════════════════════════════════════════
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for(let i=0;i<60;i++) particles.push({
    x: Math.random()*1000,
    y: Math.random()*1000,
    r: Math.random()*1.8+0.3,
    speed: Math.random()*0.3+0.05,
    opacity: Math.random()*0.5+0.1,
    hue: Math.random()>0.5 ? 340 : 42,
  });

  function draw(){
    ctx.clearRect(0,0,W,H);
    // Radial vignette
    const grad = ctx.createRadialGradient(W/2,H*0.4,0,W/2,H*0.4,Math.max(W,H)*0.7);
    grad.addColorStop(0,'rgba(30,0,20,0.4)');
    grad.addColorStop(1,'rgba(5,0,10,0.9)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    particles.forEach(p => {
      p.y -= p.speed;
      if(p.y < -10) { p.y = H+10; p.x = Math.random()*W; }
      ctx.beginPath();
      ctx.arc(p.x % W, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue},70%,70%,${p.opacity})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ═══════════════════════════════════════════════════════════
//  VIDEO MANAGER
//  Replace the src strings with your own .mp4 files:
//    videos.vineyard = './videos/vineyard.mp4'
//    videos.cellar   = './videos/cellar.mp4'
//    videos.pool     = './videos/pool.mp4'
// ═══════════════════════════════════════════════════════════
const videos = {
  title:    '',   // './videos/title.mp4'
  vineyard: '',   // './videos/vineyard.mp4'
  cellar:   '',   // './videos/cellar.mp4'
  pool:     '',   // './videos/pool.mp4'
};

function setVideo(key){
  const v = document.getElementById('bg-video');
  const src = videos[key] || '';
  if(src){
    v.src = src;
    v.load();
    v.play().catch(()=>{});
    v.classList.add('visible');
  } else {
    v.classList.remove('visible');
  }
}

// ═══════════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════════
let state = {
  heat: 0,
  touchCount: 0,
  path: null,
  nextPassage: null,
  endingsFound: new Set(),
};

// Touches needed per scene to unlock Continue
const TOUCHES_NEEDED = 7;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showTitle(){ showScreen('screen-title'); setVideo('title'); }

// ═══════════════════════════════════════════════════════════
//  HOTSPOT RESPONSES  (zone → [heat_tier_0, tier_1, tier_2])
// ═══════════════════════════════════════════════════════════
const responses = {
  'zone-hair': [
    'You run your fingers through his dark hair. It is thick and warm.',
    'He tilts his head back slightly as your fingers move through his hair. A small sound escapes him.',
    '<em>He catches your wrist and presses his lips to your palm before letting go.</em>',
  ],
  'zone-face': [
    'You trace the line of his jaw with your fingertips. The stubble is rough and real.',
    'He turns toward your touch, eyes half-closed. <em>"I have been thinking about this since the moment you arrived."</em>',
    'He kisses the inside of your wrist, slow and deliberate, watching you the entire time.',
  ],
  'zone-neck': [
    'You press your lips to the curve of his neck. He stills completely.',
    '<em>His pulse quickens under your mouth.</em> He exhales slowly, as if he has been holding his breath.',
    'He tips his head to give you more. His hands find your waist and pull you closer.',
  ],
  'zone-shoulders': [
    'You rest your hands on his shoulders. He is warm through the fabric.',
    'You push his jacket off his shoulders. He lets you.',
    '<em>The shirt follows. Your hands explore what you find — unhurried, possessive.</em>',
  ],
  'zone-chest': [
    'Your palm rests flat against his chest. You can feel his heartbeat.',
    '<em>His breath catches.</em> He covers your hand with his.',
    'He pulls you against him. The warmth of his skin is extraordinary against yours.',
  ],
  'zone-waist': [
    'Your hands find his waist. He is lean and warm.',
    'He makes a low sound when your fingers press in. His hands mirror yours.',
    '<em>He says your name. Just that — quiet, focused, as though it is the only word that matters.</em>',
  ],
  'zone-hips': [
    'You trace the curve of his hip. He does not move away.',
    '<em>He pulls you closer by your own waist.</em> The space between you disappears.',
    'He tips you back against the wall — gently, completely — and takes his time.',
  ],
  'zone-thighs': [
    'Your fingers brush his thigh. He becomes very still.',
    '<em>His hand covers yours.</em> He looks at you with complete attention.',
    'He guides your hand deliberately and watches your face as he does. The patience in him is undoing.',
  ],
};

// ═══════════════════════════════════════════════════════════
//  INTERACTION SCREEN
// ═══════════════════════════════════════════════════════════
function showInteraction(nextPassage){
  state.nextPassage = nextPassage;
  state.touchCount  = 0;
  state.heat        = 0;
  updateHeat();

  document.getElementById('interact-hint').textContent = 'Touch him to explore →';
  document.getElementById('interact-continue').classList.remove('ready');
  hideToast();

  showScreen('screen-interact');

  // Wire up zone events
  document.querySelectorAll('.char-zone').forEach(zone => {
    zone.onpointerdown = (e) => { e.stopPropagation(); handleZoneTouch(zone, e); };
  });
}

function handleZoneTouch(zone, e){
  const zoneId = zone.id;
  const tier = state.heat < 33 ? 0 : state.heat < 66 ? 1 : 2;
  const resArr = responses[zoneId];
  if(!resArr) return;

  const text = resArr[tier] || resArr[resArr.length-1];

  // Show toast
  showToast(text);

  // Glow the zone
  const glow = document.getElementById('glow-' + zoneId.replace('zone-',''));
  if(glow){
    glow.style.opacity = '0.18';
    glow.style.transition = 'opacity 0.2s';
    setTimeout(()=>{ glow.style.opacity='0'; }, 600);
  }

  // Burst ring at touch point
  spawnRing(e);
  spawnParticles(e, 8);

  // Increment
  state.touchCount++;
  const newHeat = Math.min(100, Math.round((state.touchCount / TOUCHES_NEEDED) * 100));
  state.heat = newHeat;
  updateHeat();

  if(state.touchCount >= TOUCHES_NEEDED){
    document.getElementById('interact-hint').textContent = 'Ready to continue ↓';
    document.getElementById('interact-continue').classList.add('ready');
  }
}

function updateHeat(){
  const pct = state.heat + '%';
  document.getElementById('heat-fill').style.width = pct;
  document.getElementById('heat-pct').textContent  = pct;
}

function showToast(html){
  const t = document.getElementById('response-toast');
  t.innerHTML = html;
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(hideToast, 3200);
}
function hideToast(){
  document.getElementById('response-toast').classList.remove('show');
}

function continueFromInteraction(){
  if(state.nextPassage) goToPassage(state.nextPassage);
}

// ── Burst effects ──
function spawnRing(e){
  const stage = document.getElementById('char-stage');
  const rect  = stage.getBoundingClientRect();
  const x = (e.clientX || (e.touches&&e.touches[0].clientX) || rect.left+rect.width/2) - rect.left;
  const y = (e.clientY || (e.touches&&e.touches[0].clientY) || rect.top+rect.height/2) - rect.top;
  const ring = document.createElement('div');
  ring.className = 'click-ring';
  ring.style.cssText = `left:${x}px;top:${y}px;width:60px;height:60px;`;
  stage.appendChild(ring);
  void ring.offsetWidth;
  ring.classList.add('burst');
  setTimeout(()=>ring.remove(), 700);
}

function spawnParticles(e, n){
  const stage = document.getElementById('char-stage');
  const rect  = stage.getBoundingClientRect();
  const cx = (e.clientX || (e.touches&&e.touches[0].clientX) || rect.left+rect.width/2) - rect.left;
  const cy = (e.clientY || (e.touches&&e.touches[0].clientY) || rect.top+rect.height/2) - rect.top;
  for(let i=0;i<n;i++){
    const p  = document.createElement('div');
    const angle = (Math.PI*2/n)*i;
    const dist  = 30+Math.random()*40;
    const px    = Math.cos(angle)*dist;
    const py    = Math.sin(angle)*dist;
    const size  = 3+Math.random()*4;
    const hue   = Math.random()>0.5 ? 340 : 42;
    p.className = 'particle';
    p.style.cssText = `left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;background:hsl(${hue},80%,65%);--px:${px}px;--py:${py}px;`;
    stage.appendChild(p);
    setTimeout(()=>p.remove(), 900);
  }
}

// ═══════════════════════════════════════════════════════════
//  PASSAGE ENGINE
// ═══════════════════════════════════════════════════════════
function goToPassage(id){
  const p = passages[id];
  if(!p){ console.warn('Missing passage:', id); return; }
  if(p.path) state.path = p.path;

  // Update progress dots
  updateDots(p.dot);

  if(p.isInteraction){
    setVideo(p.videoKey || state.path || 'title');
    showInteraction(p.next);
    return;
  }
  if(p.isEnding){
    state.endingsFound.add(id);
    setVideo('title');
    document.getElementById('end-title').textContent = p.endingTitle;
    document.getElementById('end-text').textContent  = p.endingText;
    document.getElementById('endings-count').textContent = `Endings found: ${state.endingsFound.size} / 3`;
    showScreen('screen-end');
    return;
  }

  // Story passage
  setVideo(p.videoKey || state.path || 'title');
  document.getElementById('story-chapter').textContent = p.chapter || '';
  document.getElementById('story-title').textContent   = p.title   || '';
  document.getElementById('story-text').innerHTML      = p.text    || '';

  const choicesEl = document.getElementById('story-choices');
  choicesEl.innerHTML = '';
  (p.choices||[]).forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'story-choice';
    btn.innerHTML = `<span class="story-choice-arrow">›</span>${c.text}`;
    btn.onclick = ()=>{ window.scrollTo(0,0); setTimeout(()=>goToPassage(c.goto), 120); };
    choicesEl.appendChild(btn);
  });

  showScreen('screen-story');
  window.scrollTo(0,0);
}

function updateDots(dotIndex){
  if(dotIndex === undefined) return;
  for(let i=0;i<3;i++){
    const d = document.getElementById('dot-'+i);
    if(i < dotIndex) d.className = 'dot done';
    else if(i === dotIndex) d.className = 'dot active';
    else d.className = 'dot';
  }
}
